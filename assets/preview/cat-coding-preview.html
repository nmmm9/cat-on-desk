<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>cat-coding SVG preview</title>
  <style>
    body { margin: 0; padding: 24px; font-family: -apple-system, "Segoe UI", sans-serif; background: #f4f4f4; }
    h2 { font-size: 14px; color: #555; margin: 16px 0 8px; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; }
    .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .card img { display: block; image-rendering: pixelated; }
    .small img { width: 70px; height: 52px; }
    .medium img { width: 175px; height: 130px; }
    .large img { width: 350px; height: 260px; }
  </style>
</head>
<body>
  <h2>원본 (참고)</h2>
  <div class="row">
    <div class="card large">
      <img src="../../../clawdondesk/KakaoTalk_20260508_233416788.png" alt="reference" />
    </div>
  </div>

  <h2>SVG 시안 — small / medium / large</h2>
  <div class="row">
    <div class="card small"><img src="../../src/theme/default-cat/cat-coding.svg" alt="cat-coding small" /></div>
    <div class="card medium"><img src="../../src/theme/default-cat/cat-coding.svg" alt="cat-coding medium" /></div>
    <div class="card large"><img src="../../src/theme/default-cat/cat-coding.svg" alt="cat-coding large" /></div>
  </div>
</body>
