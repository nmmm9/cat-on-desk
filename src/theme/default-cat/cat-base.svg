<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="shape-rendering: crispEdges;">
  <defs>
    <style>
      .outline { fill: none; stroke: #000; stroke-width: 8; stroke-linecap: butt; stroke-linejoin: miter; }
      .base { fill: #FCAE52; }
      .stripe { fill: none; stroke: #E07A22; stroke-width: 8; stroke-linecap: butt; stroke-linejoin: miter; }
      .face { fill: none; stroke: #000; stroke-width: 6; stroke-linecap: square; stroke-linejoin: miter; }

      @keyframes wag {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(15deg); }
        70% { transform: rotate(-5deg); }
      }
      #tail {
        transform-origin: 140px 140px;
        animation: wag 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- TAIL -->
  <g id="tail">
    <path d="M 140 145 C 175 145, 180 115, 175 90 C 172 80, 158 80, 160 90 C 165 115, 155 135, 140 135 Z" class="base" />
    <path d="M 163 115 L 168 115" class="stripe" />
    <path d="M 165 98 L 170 98" class="stripe" />
    <path d="M 140 145 C 175 145, 180 115, 175 90 C 172 80, 158 80, 160 90 C 165 115, 155 135, 140 135 Z" class="outline" />
  </g>

  <!-- BODY & LEFT LEG -->
  <g id="body">
    <path d="M 65 95 C 55 120, 55 140, 55 160 C 55 172, 75 172, 75 160 L 75 165 L 135 165 C 155 165, 165 130, 140 95 Z" class="base" />
    <path d="M 58 115 L 66 115" class="stripe" />
    <path d="M 56 130 L 64 130" class="stripe" />
    <path d="M 55 145 L 67 145" class="stripe" />
    <path d="M 55 155 L 67 155" class="stripe" />
    <path d="M 146 115 L 126 120" class="stripe" />
    <path d="M 154 135 L 134 140" class="stripe" />
    <path d="M 65 95 C 55 120, 55 140, 55 160 C 55 172, 75 172, 75 160 L 75 165 L 135 165 C 155 165, 165 130, 140 95 Z" class="outline" />
    <path d="M 75 160 L 75 135" class="outline" />
  </g>

  <!-- RIGHT FRONT LEG -->
  <g id="front-legs">
    <path d="M 98 135 L 98 160 C 98 172, 118 172, 118 160 L 118 135 Z" class="base" />
    <path d="M 102 142 L 114 142" class="stripe" />
    <path d="M 102 152 L 114 152" class="stripe" />
    <path d="M 98 135 L 98 160 C 98 172, 118 172, 118 160 L 118 135" class="outline" />
  </g>

  <!-- HEAD -->
  <g id="head">
    <path d="M 45 80 C 45 60, 55 45, 65 45 L 68 28 L 73 28 L 85 40 C 95 38, 105 38, 115 40 L 125 28 L 130 28 L 135 45 C 145 45, 155 60, 155 80 C 150 115, 50 115, 45 80 Z" class="base" />

    <path d="M 78 37 L 82 55" class="stripe" />
    <path d="M 102 37 L 98 55" class="stripe" />

    <path d="M 45 80 C 45 60, 55 45, 65 45 L 68 28 L 73 28 L 85 40 C 95 38, 105 38, 115 40 L 125 28 L 130 28 L 135 45 C 145 45, 155 60, 155 80 C 150 115, 50 115, 45 80 Z" class="outline" />
  </g>

  <!-- FACE -->
  <g id="face">
    <!-- Eyes -->
    <circle cx="70" cy="68" r="4" fill="#000" />
    <circle cx="110" cy="68" r="4" fill="#000" />

    <!-- Nose -->
    <rect x="87" y="73" width="6" height="4" fill="#000" />

    <!-- Mouth -->
    <path d="M 74 78 C 76 85, 90 85, 90 77" class="face" />
    <path d="M 106 78 C 104 85, 90 85, 90 77" class="face" />
  </g>
</svg>
