<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 52" width="350" height="260" shape-rendering="crispEdges">
  <!-- ===== LAPTOP ===== -->
  <!-- screen back panel (the side we see in profile view) -->
  <rect x="4" y="18" width="22" height="18" fill="#1A1A1A"/>
  <rect x="6" y="20" width="18" height="14" fill="#BFBFBF"/>
  <rect x="6" y="20" width="18" height="2" fill="#9E9E9E"/>
  <rect x="6" y="32" width="18" height="2" fill="#9E9E9E"/>

  <!-- paw print logo on the back panel -->
  <rect x="13" y="25" width="4" height="3" fill="#1A1A1A"/>
  <rect x="12" y="26" width="1" height="2" fill="#1A1A1A"/>
  <rect x="17" y="26" width="1" height="2" fill="#1A1A1A"/>
  <rect x="13" y="23" width="1" height="1" fill="#1A1A1A"/>
  <rect x="16" y="23" width="1" height="1" fill="#1A1A1A"/>
  <rect x="11" y="24" width="1" height="1" fill="#1A1A1A"/>
  <rect x="18" y="24" width="1" height="1" fill="#1A1A1A"/>

  <!-- keyboard base (slightly wider than screen) -->
  <rect x="2" y="36" width="32" height="1" fill="#1A1A1A"/>
  <rect x="2" y="37" width="32" height="3" fill="#9E9E9E"/>
  <rect x="2" y="40" width="32" height="1" fill="#1A1A1A"/>

  <!-- ===== CAT BODY ===== -->
  <!-- main body block -->
  <rect x="22" y="22" width="34" height="14" fill="#F5A050"/>
  <!-- body outline -->
  <rect x="22" y="21" width="34" height="1" fill="#1A1A1A"/>
  <rect x="22" y="36" width="34" height="1" fill="#1A1A1A"/>
  <rect x="55" y="22" width="1" height="14" fill="#1A1A1A"/>

  <!-- HEAD (sits to the left, looking down at laptop) -->
  <rect x="22" y="14" width="14" height="11" fill="#F5A050"/>
  <rect x="22" y="13" width="14" height="1" fill="#1A1A1A"/>
  <rect x="35" y="14" width="1" height="8" fill="#1A1A1A"/>
  <rect x="22" y="25" width="13" height="1" fill="#1A1A1A"/>
  <rect x="21" y="14" width="1" height="11" fill="#1A1A1A"/>

  <!-- ears -->
  <rect x="23" y="11" width="3" height="3" fill="#F5A050"/>
  <rect x="32" y="11" width="3" height="3" fill="#F5A050"/>
  <rect x="22" y="11" width="1" height="3" fill="#1A1A1A"/>
  <rect x="26" y="11" width="1" height="3" fill="#1A1A1A"/>
  <rect x="23" y="10" width="3" height="1" fill="#1A1A1A"/>
  <rect x="31" y="11" width="1" height="3" fill="#1A1A1A"/>
  <rect x="35" y="11" width="1" height="3" fill="#1A1A1A"/>
  <rect x="32" y="10" width="3" height="1" fill="#1A1A1A"/>
  <!-- inner ear pink -->
  <rect x="24" y="12" width="1" height="2" fill="#F58BA0"/>
  <rect x="33" y="12" width="1" height="2" fill="#F58BA0"/>

  <!-- head stripes -->
  <rect x="24" y="14" width="1" height="2" fill="#C97431"/>
  <rect x="27" y="14" width="1" height="2" fill="#C97431"/>
  <rect x="30" y="14" width="1" height="2" fill="#C97431"/>
  <rect x="33" y="14" width="1" height="2" fill="#C97431"/>

  <!-- eyes -->
  <rect x="26" y="18" width="1" height="2" fill="#1A1A1A"/>
  <rect x="30" y="18" width="1" height="2" fill="#1A1A1A"/>
  <!-- eye shine -->
  <rect x="26" y="18" width="1" height="1" fill="#FFFFFF"/>
  <rect x="30" y="18" width="1" height="1" fill="#FFFFFF"/>

  <!-- nose -->
  <rect x="28" y="21" width="1" height="1" fill="#F58BA0"/>
  <!-- mouth (smile) -->
  <rect x="27" y="22" width="1" height="1" fill="#1A1A1A"/>
  <rect x="29" y="22" width="1" height="1" fill="#1A1A1A"/>
  <rect x="28" y="23" width="1" height="1" fill="#1A1A1A"/>

  <!-- ===== BODY DETAILS ===== -->
  <!-- back stripes (top of body) -->
  <rect x="38" y="22" width="2" height="2" fill="#C97431"/>
  <rect x="42" y="22" width="2" height="2" fill="#C97431"/>
  <rect x="46" y="22" width="2" height="2" fill="#C97431"/>
  <rect x="50" y="22" width="2" height="2" fill="#C97431"/>

  <!-- side stripes (middle) -->
  <rect x="38" y="26" width="2" height="1" fill="#C97431"/>
  <rect x="42" y="26" width="2" height="1" fill="#C97431"/>
  <rect x="46" y="26" width="2" height="1" fill="#C97431"/>
  <rect x="50" y="26" width="2" height="1" fill="#C97431"/>

  <!-- white belly/chest -->
  <rect x="22" y="30" width="22" height="6" fill="#FFFFFF"/>
  <rect x="22" y="29" width="22" height="1" fill="#1A1A1A"/>
  <rect x="44" y="30" width="1" height="6" fill="#1A1A1A"/>

  <!-- front paws on keyboard -->
  <rect x="24" y="36" width="4" height="4" fill="#FFFFFF"/>
  <rect x="24" y="36" width="4" height="1" fill="#1A1A1A"/>
  <rect x="23" y="37" width="1" height="3" fill="#1A1A1A"/>
  <rect x="28" y="37" width="1" height="3" fill="#1A1A1A"/>
  <rect x="24" y="40" width="4" height="1" fill="#1A1A1A"/>
  <!-- toe lines -->
  <rect x="25" y="38" width="1" height="2" fill="#E5E5E5"/>
  <rect x="26" y="38" width="1" height="2" fill="#E5E5E5"/>

  <rect x="30" y="36" width="4" height="4" fill="#FFFFFF"/>
  <rect x="30" y="36" width="4" height="1" fill="#1A1A1A"/>
  <rect x="29" y="37" width="1" height="3" fill="#1A1A1A"/>
  <rect x="34" y="37" width="1" height="3" fill="#1A1A1A"/>
  <rect x="30" y="40" width="4" height="1" fill="#1A1A1A"/>
  <rect x="31" y="38" width="1" height="2" fill="#E5E5E5"/>
  <rect x="32" y="38" width="1" height="2" fill="#E5E5E5"/>

  <!-- ===== TAIL (curving up to the right) ===== -->
  <rect x="56" y="22" width="3" height="3" fill="#F5A050"/>
  <rect x="58" y="19" width="3" height="3" fill="#F5A050"/>
  <rect x="60" y="16" width="3" height="3" fill="#F5A050"/>
  <rect x="61" y="13" width="3" height="3" fill="#F5A050"/>
  <!-- tail outline -->
  <rect x="56" y="21" width="3" height="1" fill="#1A1A1A"/>
  <rect x="58" y="18" width="3" height="1" fill="#1A1A1A"/>
  <rect x="60" y="15" width="3" height="1" fill="#1A1A1A"/>
  <rect x="61" y="12" width="3" height="1" fill="#1A1A1A"/>
  <rect x="64" y="13" width="1" height="3" fill="#1A1A1A"/>
  <rect x="63" y="16" width="1" height="3" fill="#1A1A1A"/>
  <rect x="61" y="19" width="1" height="3" fill="#1A1A1A"/>
  <rect x="59" y="22" width="1" height="3" fill="#1A1A1A"/>
  <rect x="55" y="25" width="1" height="1" fill="#1A1A1A"/>
  <!-- tail stripes -->
  <rect x="57" y="23" width="1" height="2" fill="#C97431"/>
  <rect x="59" y="20" width="1" height="2" fill="#C97431"/>
  <rect x="61" y="17" width="1" height="2" fill="#C97431"/>
  <rect x="62" y="14" width="1" height="2" fill="#C97431"/>
</svg>
